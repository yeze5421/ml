name: mlipx_minimal
data:
  path: data/demo.extxyz
  format: extxyz
  energy_key: energy
  force_key: forces
  cutoff: 5.0
  max_neighbors: 32
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  batch_size: 4
  num_workers: 0
  normalize_energy_per_atom: true
model:
  hidden_dim: 64
  n_interactions: 3
  n_rbf: 24
  cutoff: 5.0
train:
  seed: 42
  device: auto
  epochs: 3
  lr: 0.0005
  weight_decay: 1.0e-6
  energy_weight: 1.0
  force_weight: 20.0
  grad_clip: 5.0
  amp: false
  scheduler: cosine
  scheduler_tmax: 3
  early_stopping_patience: 10
  output_dir: artifacts/minimal
  resume_checkpoint: null
