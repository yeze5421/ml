[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlipx"
version = "0.2.0"
description = "Research-engineering MLIP project with PaiNN-style architecture"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "ase>=3.23",
  "numpy>=1.24",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["mlipx*"]
